# Render blueprint — ONE web service: FastAPI serves the API and the
# statically-exported Next.js frontend on a single port (one public link,
# no CORS, no two-service drift). Vercel is only a documented fallback.
# Deploy: Render dashboard → New + → Blueprint → pick this repo.
services:
  - type: web
    name: the-estimator
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # "stub" works with zero keys (offline rule-based extractor).
      # Switch to "deepseek" and set DEEPSEEK_API_KEY for real LLM extraction
      # (or "gemini" + GEMINI_API_KEY).
      - key: LLM_PROVIDER
        value: stub
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
