# Render blueprint — ONE web service: FastAPI serves the API and the
# statically-exported Next.js frontend on a single port (one public link,
# no CORS, no two-service drift). Vercel is only a documented fallback.
# Deploy: Render dashboard → New + → Blueprint → pick this repo.
services:
  - type: web
    name: the-estimator
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # "deepseek" runs real LLM extraction when DEEPSEEK_API_KEY is set and
      # gracefully falls back to the offline stub when it is missing.
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
